name: EPG·M3U 자동 갱신 (+ pjy 변경 감지)

on:
  schedule:
    - cron: '13,43 * * * *'    # 매시 13분·43분(UTC). 정각 혼잡 회피 / SBS 토큰 수명 2시간 대응
  workflow_dispatch:            # 수동 실행 버튼

permissions:
  contents: write

concurrency:
  group: epg-merge
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 파이썬 준비
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # ── 1. pjy koreatv.json 변경 감지 (기존 pjy-hash-check.yml 로직 이관) ──
      - name: pjy koreatv.json 내려받기
        id: dl
        run: |
          URL="https://raw.githubusercontent.com/kenpark76/kenpark76.github.io/main/koreatv.json"
          ok=0
          for i in 1 2 3; do
            if curl -fsSL --retry 3 --retry-delay 5 -o /tmp/koreatv.json "$URL"; then
              ok=1
              break
            fi
            sleep 10
          done
          if [ "$ok" -ne 1 ]; then
            echo "download_failed=true" >> "$GITHUB_OUTPUT"
            echo "::warning::pjy koreatv.json 다운로드 실패 - 해시 비교를 건너뜁니다"
          else
            echo "download_failed=false" >> "$GITHUB_OUTPUT"
            echo "size=$(stat -c%s /tmp/koreatv.json)" >> "$GITHUB_OUTPUT"
          fi

      - name: pjy 해시 비교
        if: steps.dl.outputs.download_failed == 'false'
        id: hash
        run: |
          NEW=$(sha256sum /tmp/koreatv.json | awk '{print $1}')
          OLD=""
          if [ -f .pjy-hash ]; then
            OLD=$(tr -d '[:space:]' < .pjy-hash)
          fi
          echo "new_hash=$NEW" >> "$GITHUB_OUTPUT"
          echo "old_hash=$OLD" >> "$GITHUB_OUTPUT"
          if [ "$NEW" != "$OLD" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "pjy koreatv.json CHANGED: $OLD -> $NEW"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "pjy koreatv.json unchanged"
          fi

      # ── 2. 기존 갱신 파이프라인 (매시 무조건 실행: SBS JWT 수명 2시간) ──
      - name: M3U 스트림 주소 갱신 (SBS·KBS 만료 토큰 교체)
        run: python update-m3u.py

      - name: EPG 병합
        run: python merge.py

      - name: gzip 압축
        run: gzip -9 -kf epg-kr-merged.xml

      # ── 3. pjy 해시 기록 (바뀐 경우에만) ──
      - name: pjy 해시 기록
        if: steps.hash.outputs.changed == 'true'
        run: |
          printf '%s\n' "${{ steps.hash.outputs.new_hash }}" > .pjy-hash
          echo "해시 갱신: ${{ steps.hash.outputs.new_hash }}"

      # ── 4. 변경 시에만 커밋·푸시 ──
      - name: 변경 시에만 커밋·푸시
        run: |
          git config user.name  "epg-bot"
          git config user.email "actions@github.com"
          git add epg-kr-merged.xml epg-kr-merged.xml.gz koreatv-final.m3u .pjy-hash
          if git diff --cached --quiet; then
            echo "변경 없음 - 커밋 생략"
            exit 0
          fi
          MSG="자동 갱신 $(date -u +'%Y-%m-%d %H:%M') UTC"
          if [ "${{ steps.hash.outputs.changed }}" = "true" ]; then
            MSG="$MSG (pjy 변경 감지)"
          fi
          git commit -m "$MSG"
          git push || { git pull --rebase && git push; }

      # ── 5. 실행 요약 ──
      - name: 실행 요약
        if: always()
        run: |
          SZ="${{ steps.dl.outputs.size }}"
          if [ -z "$SZ" ]; then SZ="-"; fi
          {
            echo "### EPG·M3U 자동 갱신 결과"
            echo ""
            echo "| 항목 | 값 |"
            echo "|---|---|"
            echo "| pjy 다운로드 | ${{ steps.dl.outputs.download_failed }} (true=실패) |"
            echo "| pjy 파일 크기 | ${SZ} bytes |"
            echo "| 이전 해시 | ${{ steps.hash.outputs.old_hash }} |"
            echo "| 현재 해시 | ${{ steps.hash.outputs.new_hash }} |"
            echo "| pjy 변경 | ${{ steps.hash.outputs.changed }} |"
          } >> "$GITHUB_STEP_SUMMARY"

